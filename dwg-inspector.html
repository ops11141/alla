<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بيانات الرسم | قسم الصيانة</title><style>body{margin:0;background:#eef5f3;font-family:Tahoma,Arial;color:#17332c}.head{background:#075f49;color:#fff;padding:22px}.wrap{max-width:1200px;margin:auto;padding:18px}.card{background:#fff;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 8px 25px #0000000a}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{border:0;border-radius:12px;padding:11px 14px;background:#e6f2ee;color:#075f49;font-weight:700}.tabs button.active{background:#075f49;color:#fff}.pre{background:#101817;color:#dff8ef;padding:14px;border-radius:14px;overflow:auto;max-height:650px;direction:ltr;text-align:left;font:12px monospace}.bad{background:#fff0f0;color:#a00;padding:12px;border-radius:12px}.ok{background:#edf8f4;padding:12px;border-radius:12px}.nav a{color:#fff;margin-left:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#edf7f4;padding:15px;border-radius:15px;text-align:center}.stat b{display:block;font-size:24px;color:#075f49}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="head"><div class="wrap"><h1>🧰 بيانات الرسم</h1><div class="nav"><a href="feeders.html">← دليل المغذيات</a> <a href="index.html">الرئيسية</a></div></div></div><main class="wrap"><section class="card"><h2>فحص DWG</h2><div id="status">جاري تحميل النتائج...</div><div class="grid" id="stats"></div></section><section class="card"><div class="tabs" id="tabs"></div><pre class="pre" id="out">...</pre></section></main><script>
const files=['manifest.json','stations.json','feeders.json','all_text_entities.json','all_feeder_candidates.json','layers.json','blocks.json','entity_types.json','database_tables.json','full_analysis.json'];let cache={};
const esc=s=>String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
async function init(){try{for(const f of files){const r=await fetch('data/feeders/'+f,{cache:'no-store'});if(r.ok)cache[f]=await r.json()}if(!cache['manifest.json'])throw new Error('لم يتم العثور على البيانات المولدة');const m=cache['manifest.json'];document.getElementById('status').className='ok';document.getElementById('status').textContent='تم العثور على بيانات الرسم المولدة.';document.getElementById('stats').innerHTML=Object.entries(m.counts||{}).map(([k,v])=>'<div class="stat">'+esc(k)+'<b>'+esc(v)+'</b></div>').join('');const tabs=document.getElementById('tabs');files.filter(f=>cache[f]).forEach((f,i)=>{const b=document.createElement('button');b.textContent=f;b.onclick=()=>show(f,b);if(i===0)b.classList.add('active');tabs.appendChild(b)});show(files.find(f=>cache[f]));}catch(e){document.getElementById('status').className='bad';document.getElementById('status').textContent=e.message+'. شغّل GitHub Action Build feeder database.'}}
function show(f,btn){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');document.getElementById('out').textContent=JSON.stringify(cache[f],null,2)}init();</script></body></html>
