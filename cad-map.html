<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>خريطة CAD الجغرافية | قسم الصيانة</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#111}
#map{direction:ltr}
.panel{position:absolute;z-index:1000;top:12px;right:12px;width:min(360px,calc(100vw - 24px));background:rgba(20,20,20,.94);color:#fff;border-radius:14px;padding:14px;box-shadow:0 8px 30px #0008}
.panel h2{font-size:17px;margin:0 0 10px}
.panel p{font-size:12px;color:#bbb;margin:5px 0 12px;line-height:1.5}
input{width:100%;box-sizing:border-box;border:1px solid #555;background:#292929;color:#fff;border-radius:9px;padding:10px;margin-bottom:8px}
button{border:0;border-radius:9px;padding:9px 11px;background:#2f7d32;color:#fff;font-weight:700;margin:2px;cursor:pointer}
button.alt{background:#444}
.row{display:flex;align-items:center;gap:8px;margin-top:8px}
.row label{font-size:12px;white-space:nowrap}
input[type=range]{margin:0}
.badge{font-size:11px;color:#9fe6a0;margin-top:8px}
.equipment-label{
  background:rgba(255,255,255,.94);
  color:#111;
  border:1px solid rgba(0,0,0,.28);
  border-radius:5px;
  padding:2px 5px;
  font-size:11px;
  line-height:1.2;
  font-weight:800;
  white-space:nowrap;
  box-shadow:0 1px 4px rgba(0,0,0,.35);
  direction:rtl;
  pointer-events:auto;
}
.equipment-label:before{display:none}
.equipment-label:hover{background:#fff;transform:scale(1.08)}
.search-highlight{
  background:#ffd400;
  border:2px solid #111;
  color:#111;
  border-radius:6px;
  padding:3px 7px;
  font-size:13px;
  font-weight:900;
  box-shadow:0 2px 8px #0008;
}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h2>🗺️ خريطة CAD + الخريطة الواقعية</h2>
  <p>الأرقام تظهر تلقائيًا عند التكبير، ويمكن الضغط على رقم المحول مباشرة لعرض بياناته.</p>
  <input id="search" placeholder="ابحث عن رقم المعدة مثل 17716 أو 871">
  <button id="find">بحث</button>
  <button class="alt" id="fit">المعدات</button>
  <div class="row">
    <label>شفافية CAD</label>
    <input id="opacity" type="range" min="0" max="100" value="55">
  </div>
  <div class="badge" id="status">جاري تحميل بيانات المعدات…</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map',{zoomControl:true}).setView([28.43,45.97],12);
const street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap contributors'}).addTo(map);
const satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'}); 
L.control.layers({'الشوارع':street,'الأقمار الصناعية':satellite}).addTo(map);

let equipment=[];
const markers=L.layerGroup().addTo(map);
const labels=L.layerGroup().addTo(map);
let labelRefreshTimer=null;
let highlightedLabel=null;

// هذه الحدود الأولية فقط. بعد تحديد نقاط التحكم الحقيقية للـCAD يتم استبدالها
// بحدود جغرافية محسوبة آليًا من التحويل الهندسي.
const cadBounds=[[28.365,45.935],[28.465,45.995]];
let cadLayer=null;
function addCad(){
  if(cadLayer) map.removeLayer(cadLayer);
  cadLayer=L.imageOverlay('data/feeders/full-drawing.svg',cadBounds,{opacity:+document.getElementById('opacity').value/100,interactive:false});
  cadLayer.addTo(map);
}
addCad();

document.getElementById('opacity').oninput=e=>{
  if(cadLayer) cadLayer.setOpacity(+e.target.value/100);
};

fetch('data/equipment-lookup.json')
.then(r=>r.json())
.then(data=>{
  const records=data.records||{};
  Object.keys(records).forEach(key=>{
    (records[key]||[]).forEach(row=>{
      const name=row[0],lat=+row[1],lon=+row[2];
      if(!Number.isFinite(lat)||!Number.isFinite(lon)) return;
      const m=L.circleMarker([lat,lon],{
        radius:4,
        weight:1,
        fillOpacity:.85,
        bubblingMouseEvents:true
      });
      m.bindPopup('<b>'+escapeHtml(name)+'</b><br>Lat: '+lat+'<br>Lon: '+lon);
      m.options._equipmentKey=key;
      m.options._equipmentName=name;
      markers.addLayer(m);
      equipment.push(m);
    });
  });
  document.getElementById('status').textContent='تم تحميل '+equipment.length.toLocaleString('en-US')+' نقطة معدات. كبّر الخريطة لإظهار الأرقام.';
  refreshLabels();
  if(equipment.length) map.fitBounds(markers.getBounds().pad(.08));
})
.catch(e=>document.getElementById('status').textContent='تعذر تحميل قاعدة بيانات المعدات.');

function refreshLabels(){
  clearTimeout(labelRefreshTimer);
  labelRefreshTimer=setTimeout(()=>{
    labels.clearLayers();

    // الأرقام لا تظهر في الزوم البعيد حتى لا تغطي الخريطة.
    if(map.getZoom()<16 || !equipment.length) return;

    const bounds=map.getBounds().pad(.12);
    const visible=equipment.filter(m=>bounds.contains(m.getLatLng()));

    // حماية الأداء عند وجود عدد ضخم من النقاط في نفس الشاشة.
    const maxLabels=1200;
    const list=visible.length>maxLabels
      ? visible.slice(0,maxLabels)
      : visible;

    list.forEach(m=>{
      const text=escapeHtml(m.options._equipmentName);
      const label=L.marker(m.getLatLng(),{
        interactive:true,
        keyboard:false,
        zIndexOffset:1000,
        icon:L.divIcon({
          className:'',
          html:'<span class="equipment-label">'+text+'</span>',
          iconSize:null,
          iconAnchor:[-7,9]
        })
      });
      label.on('click',()=>{
        m.openPopup();
        map.setView(m.getLatLng(),Math.max(map.getZoom(),18));
      });
      label.addTo(labels);
    });

    document.getElementById('status').textContent=
      'الزوم '+map.getZoom()+' — ظاهر '+list.length.toLocaleString('en-US')+
      ' رقمًا من '+visible.length.toLocaleString('en-US')+' نقطة ضمن الشاشة.';
  },100);
}

map.on('zoomend moveend',refreshLabels);

document.getElementById('find').onclick=findEquipment;
document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter')findEquipment()});
document.getElementById('fit').onclick=()=>{
  if(equipment.length){
    map.fitBounds(markers.getBounds().pad(.08));
    refreshLabels();
  }
};

function findEquipment(){
  const q=normalize(document.getElementById('search').value);
  if(!q)return;

  const hit=equipment.find(m=>
    normalize(m.options._equipmentName)===q ||
    normalize(m.options._equipmentKey)===q
  );

  if(hit){
    map.setView(hit.getLatLng(),19);
    hit.openPopup();

    if(highlightedLabel) map.removeLayer(highlightedLabel);
    highlightedLabel=L.marker(hit.getLatLng(),{
      zIndexOffset:3000,
      icon:L.divIcon({
        className:'',
        html:'<span class="search-highlight">'+escapeHtml(hit.options._equipmentName)+'</span>',
        iconSize:null,
        iconAnchor:[-8,11]
      })
    }).addTo(map);

    setTimeout(()=>{
      if(highlightedLabel){
        map.removeLayer(highlightedLabel);
        highlightedLabel=null;
        refreshLabels();
      }
    },7000);
  }else{
    document.getElementById('status').textContent='لم يتم العثور على المعدة المطلوبة.';
  }
}

function normalize(v){
  return String(v||'').toUpperCase().replace(/[\s\-_/.,:;()\[\]{}#\\]+/g,'')
}
function escapeHtml(v){
  return String(v).replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[c]))
}
</script>
</body>
</html>
