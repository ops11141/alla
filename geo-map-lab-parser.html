<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEO.dwg على الخريطة | تجربة</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0}body{font-family:system-ui,Arial;background:#111}#map{direction:ltr}
.panel{position:absolute;z-index:1000;top:12px;right:12px;width:min(390px,calc(100vw - 24px));background:rgba(20,20,20,.95);color:#fff;border-radius:14px;padding:14px;box-shadow:0 8px 30px #0008;direction:rtl}
.panel h2{font-size:18px;margin:0 0 7px}.panel p{font-size:12px;color:#bbb;margin:5px 0 12px;line-height:1.6}.map-type{display:flex;gap:6px;margin-bottom:9px}.map-type button{flex:1;border:0;border-radius:9px;padding:9px;background:#3b3b3b;color:#fff;font-weight:700}.map-type button.active{background:#1976d2}
.row{display:flex;align-items:center;gap:8px;margin-top:8px}.row label{font-size:12px;white-space:nowrap}.row input{flex:1}button{border:0;border-radius:9px;padding:9px 11px;background:#2f7d32;color:#fff;font-weight:700;margin:2px;cursor:pointer}.alt{background:#444}.actions{display:flex;flex-wrap:wrap;gap:4px}.badge{font-size:11px;color:#9fe6a0;margin-top:8px;line-height:1.5}.warn{color:#ffd166}
#cadCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:450}
</style></head><body>
<div id="map"></div><canvas id="cadCanvas"></canvas>
<div class="panel"><h2>🗺️ GEO.dwg + الخريطة الواقعية</h2><p>تجربة مستقلة: قراءة GEO.dwg من الأجزاء الستة وإسقاط الخطوط على نفس خريطة مشاريعنا. الملف الأصلي لا يتغير.</p>
<div class="map-type"><button id="streetBtn" class="active">🗺️ الشوارع</button><button id="satBtn">🛰️ الخريطة الواقعية</button></div>
<div class="actions"><button id="loadBtn">▶️ تحميل GEO.dwg</button><button id="fitBtn" class="alt">ملاءمة الرسم</button></div>
<div class="row"><label>شفافية الرسم</label><input id="opacity" type="range" min="0" max="100" value="75"></div><div class="badge" id="status">جاهز — اضغط «تحميل GEO.dwg»</div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map',{zoomControl:true,preferCanvas:true}).setView([28.43,45.97],12);
const street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap contributors'}).addTo(map);
const satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'});
const canvas=document.getElementById('cadCanvas'),ctx=canvas.getContext('2d'),statusEl=document.getElementById('status'),opacityEl=document.getElementById('opacity');
const geoBounds={west:45.935,east:45.995,south:28.365,north:28.465};let segments=[],cadExtents=null,worker=null,busy=false;
function setMapType(type){if(type==='satellite'){map.removeLayer(street);satellite.addTo(map);satBtn.classList.add('active');streetBtn.classList.remove('active')}else{map.removeLayer(satellite);street.addTo(map);streetBtn.classList.add('active');satBtn.classList.remove('active')}}streetBtn.onclick=()=>setMapType('street');satBtn.onclick=()=>setMapType('satellite');
function status(t,c){statusEl.className='badge '+(c||'');statusEl.textContent=t}function resize(){const d=Math.min(2,devicePixelRatio||1),s=map.getSize();canvas.width=s.x*d;canvas.height=s.y*d;canvas.style.width=s.x+'px';canvas.style.height=s.y+'px';ctx.setTransform(d,0,0,d,0,0);draw()}window.addEventListener('resize',resize);
function point(p){return p&&Number.isFinite(p.x)&&Number.isFinite(p.y)?[p.x,p.y]:null}function line(a,b){a=point(a);b=point(b);if(a&&b)segments.push([a,b])}function poly(v,closed){if(!Array.isArray(v)||v.length<2)return;for(let i=1;i<v.length;i++)line(v[i-1],v[i]);if(closed)line(v[v.length-1],v[0])}
function entity(e){if(!e)return;switch(e.type){case'LINE':line(e.startPoint,e.endPoint);break;case'LWPOLYLINE':poly(e.vertices,!!(e.flag&512));break;case'POLYLINE2D':case'POLYLINE3D':poly(e.vertices,!!(e.flag&1));break;case'LEADER':poly(e.vertices,false);break;case'SPLINE':poly(e.controlPoints||e.fitPoints,false);break;case'CIRCLE':{let c=e.center,r=Math.abs(e.radius||0),p=null;if(c&&r)for(let i=0;i<=32;i++){let a=i*Math.PI*2/32,q={x:c.x+r*Math.cos(a),y:c.y+r*Math.sin(a)};if(p)line(p,q);p=q}break}case'ARC':{let c=e.center,r=Math.abs(e.radius||0),a0=+e.startAngle||0,a1=+e.endAngle||0,p=null;if(c&&r){if(a1<a0)a1+=Math.PI*2;for(let i=0;i<=24;i++){let a=a0+(a1-a0)*i/24,q={x:c.x+r*Math.cos(a),y:c.y+r*Math.sin(a)};if(p)line(p,q);p=q}}break}}}
function ext(){if(!segments.length)return null;let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;for(const s of segments){a=Math.min(a,s[0][0],s[1][0]);b=Math.min(b,s[0][1],s[1][1]);c=Math.max(c,s[0][0],s[1][0]);d=Math.max(d,s[0][1],s[1][1])}return{minX:a,minY:b,maxX:c,maxY:d}}
function geo(x,y){let e=cadExtents;if(!e)return null;return{lat:geoBounds.south+(y-e.minY)/(e.maxY-e.minY||1)*(geoBounds.north-geoBounds.south),lng:geoBounds.west+(x-e.minX)/(e.maxX-e.minX||1)*(geoBounds.east-geoBounds.west)}}
function draw(){if(!cadExtents||!segments.length)return;let s=map.getSize();ctx.clearRect(0,0,s.x,s.y);ctx.save();ctx.globalAlpha=(+opacityEl.value||0)/100;ctx.strokeStyle='#ff2b2b';ctx.lineWidth=1.4;for(const z of segments){let a=geo(z[0][0],z[0][1]),b=geo(z[1][0],z[1][1]);if(!a||!b)continue;let p=map.latLngToContainerPoint([a.lat,a.lng]),q=map.latLngToContainerPoint([b.lat,b.lng]);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke()}ctx.restore()}
opacityEl.oninput=draw;map.on('move zoom resize',draw);function fit(){map.fitBounds([[geoBounds.south,geoBounds.west],[geoBounds.north,geoBounds.east]],{padding:[20,20],duration:0})}fitBtn.onclick=fit;
async function bin(u,f){try{let r=await fetch(u,{cache:'no-store'});if(r.ok)return new Uint8Array(await r.arrayBuffer())}catch(e){}let r=await fetch(f,{cache:'no-store'});if(!r.ok)throw Error('تعذر تحميل الجزء');return new Uint8Array(await r.arrayBuffer())}
async function load(){if(busy)return;busy=true;segments=[];cadExtents=null;draw();loadBtn.disabled=true;try{const base='./cad-viewer/data/',raw='https://raw.githubusercontent.com/ops11141/alla/main/cad-viewer/data/';let r=await fetch(base+'geo-manifest.json?'+Date.now());let m=r.ok?await r.json():(await fetch(raw+'geo-manifest.json')).json();m=await m;let ps=[],total=0;for(let i=0;i<m.parts.length;i++){status('تحميل جزء '+(i+1)+' / '+m.parts.length+' ...');let n=m.parts[i],p=await bin(base+n+'?'+Date.now(),raw+encodeURIComponent(n));ps.push(p);total+=p.length}if(m.totalBytes&&total!==m.totalBytes)throw Error('حجم الأجزاء غير مطابق');let all=new Uint8Array(total),o=0;for(let p of ps){all.set(p,o);o+=p.length}status('تم التحميل — بدء قراءة GEO.dwg...');worker=new Worker('./cad-viewer/parser-worker.js?v=20261008-geo-map-1',{type:'module'});worker.onmessage=({data})=>{if(data.type==='progress'){let p=data.progress||{};if(p.phase==='scan')status('قراءة بيانات الرسم: '+Number(p.current||0).toLocaleString()+' / '+Number(p.total||0).toLocaleString()+' ('+(p.total?Math.round(p.current/p.total*100):0)+'%)');else if(p.phase==='scan-complete')status('تمت القراءة — جاري تحويل العناصر...');else if(p.phase==='entities')status('تحويل العناصر: '+Number(p.current||0).toLocaleString()+' / '+Number(p.total||0).toLocaleString())}else if(data.type==='batch'){for(let e of data.batch.entities||[])entity(e);cadExtents=ext();if(segments.length%10000<2500)draw()}else if(data.type==='done'){cadExtents=ext();draw();fit();status('✅ تم إسقاط '+segments.length.toLocaleString('en-US')+' مقطع من GEO.dwg على الخريطة.');busy=false;loadBtn.disabled=false}else if(data.type==='error'){status('❌ '+data.message,'warn');busy=false;loadBtn.disabled=false}};worker.onerror=e=>{status('❌ خطأ في قارئ GEO.dwg: '+(e.message||'Worker error'),'warn');busy=false;loadBtn.disabled=false};worker.postMessage({type:'open',buffer:all.buffer,includeBlocks:false},[all.buffer])}catch(e){console.error(e);status('❌ '+(e.message||String(e)),'warn');busy=false;loadBtn.disabled=false}}
loadBtn.onclick=load;resize();
</script></body></html>
