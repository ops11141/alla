<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>خريطة المعدات | MapLibre - قسم الصيانة</title>
<link href="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
html,body,#map{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#111}
#map{direction:ltr}
.layer-panel{position:absolute;z-index:12;top:12px;right:12px;width:min(260px,calc(100vw - 24px));background:rgba(20,20,20,.94);color:#fff;border-radius:14px;padding:12px;box-shadow:0 8px 30px #0008;direction:rtl}
.layer-panel h3{font-size:15px;margin:0 0 9px}.layer-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 4px;border-bottom:1px solid #333;font-size:13px}.layer-item:last-child{border-bottom:0}.layer-item input{width:auto;margin:0;accent-color:#2f7d32}.layer-meta{font-size:10px;color:#999;margin-top:7px;line-height:1.4}
.panel{position:absolute;z-index:10;bottom:12px;left:50%;transform:translateX(-50%);width:min(420px,calc(100vw - 24px));background:rgba(20,20,20,.94);color:#fff;border-radius:14px;padding:10px;box-shadow:0 8px 30px #0008}
.panel h2{font-size:17px;margin:0 0 8px}.panel p{font-size:12px;color:#bbb;margin:5px 0 12px;line-height:1.5}
input{width:100%;box-sizing:border-box;border:1px solid #555;background:#292929;color:#fff;border-radius:9px;padding:10px;margin-bottom:6px}
button{border:0;border-radius:9px;padding:9px 11px;background:#2f7d32;color:#fff;font-weight:700;margin:2px;cursor:pointer}
button.alt{background:#444}.row{display:flex;align-items:center;gap:8px;margin-top:8px}.row label{font-size:12px;white-space:nowrap}
input[type=range]{margin:0}.badge{font-size:11px;color:#9fe6a0;margin-top:8px}
.actions{display:flex;flex-wrap:wrap;gap:3px}
.popup-title{font-size:16px;font-weight:800;margin-bottom:6px;direction:rtl}.popup-coords{font-size:12px;line-height:1.6;direction:ltr;text-align:left;margin-bottom:8px}
.map-actions{display:flex;gap:6px;flex-wrap:wrap;direction:rtl}.map-btn{display:inline-block;text-decoration:none;border-radius:8px;padding:8px 10px;color:#fff;font-weight:800;font-size:12px;cursor:pointer}.google{background:#1976d2}.copy{background:#555;border:0}
.maplibregl-popup-content{border-radius:10px}
</style>
</head>
<body>
<div id="map"></div>
<div class="layer-panel">
<h3>طبقات الخريطة</h3>
<label class="layer-item"><span>المعدات</span><input id="toggleEquipment" type="checkbox" checked></label>
<label class="layer-item"><span>المغذيات</span><input id="toggleFeeders" type="checkbox"></label>
<label class="layer-item"><span>العدادات</span><input id="toggleMeters" type="checkbox"></label>
<label class="layer-item"><span>المحطات</span><input id="toggleSubstations" type="checkbox"></label>
<label class="layer-item"><span>الكابلات والخطوط</span><input id="toggleLines" type="checkbox"></label>
<label class="layer-item"><span>الكبائن واللوحات</span><input id="toggleCabinets" type="checkbox"></label>
<label class="layer-item"><span>رسم CAD</span><input id="toggleCad" type="checkbox" checked></label>
<div class="layer-meta">فعّل أي طبقة عند الحاجة. البيانات تُحمّل عند تشغيل الطبقة لتقليل استهلاك الذاكرة.</div>
</div>
<div class="panel">
<input id="search" placeholder="ابحث عن رقم المعدة مثل 17716 أو 871">
<div class="actions"><button id="find">بحث</button><button class="alt" id="fit">المعدات</button></div>
<div class="badge" id="status">جاري تجهيز الخريطة…</div>
</div>

<script src="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.js"></script>
<script>
const statusEl=document.getElementById('status');
const streetStyle={
version:8,
sources:{
osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap contributors'}
},
layers:[{id:'osm',type:'raster',source:'osm'}]
};
const map=new maplibregl.Map({
container:'map',
style:streetStyle,
center:[45.97,28.43],
zoom:10,
maxZoom:20,
attributionControl:true
});
map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-left');

let equipment=[];
let selected=null;
let cadVisible=true;
let equipmentVisible=true;
let feedersLoaded=false, metersLoaded=false, substationsLoaded=false;
let linesVisible=false, cabinetsVisible=false;
const CAD_BOUNDS={minX:87884.97798286064,maxX:131565.9304095608,minY:713.4627917406143,maxY:22216.93411639452,minLon:45.935,maxLon:45.995,minLat:28.365,maxLat:28.465};
function cadToLngLat(x,y){
const lon=CAD_BOUNDS.minLon+(x-CAD_BOUNDS.minX)/(CAD_BOUNDS.maxX-CAD_BOUNDS.minX)*(CAD_BOUNDS.maxLon-CAD_BOUNDS.minLon);
const lat=CAD_BOUNDS.maxLat-(y-CAD_BOUNDS.minY)/(CAD_BOUNDS.maxY-CAD_BOUNDS.minY)*(CAD_BOUNDS.maxLat-CAD_BOUNDS.minLat);
return [lon,lat];
}
function addPointLayer(sourceId,layerId,color,radius){
if(!map.getLayer(layerId))map.addLayer({id:layerId,type:'circle',source:sourceId,paint:{'circle-radius':radius,'circle-color':color,'circle-stroke-color':'#fff','circle-stroke-width':1.5,'circle-opacity':.92}});
}
function addLabelLayer(sourceId,layerId,field){
if(!map.getLayer(layerId))map.addLayer({id:layerId,type:'symbol',source:sourceId,layout:{'text-field':['get',field],'text-size':10,'text-offset':[0,1.1],'text-anchor':'top','text-allow-overlap':false},paint:{'text-color':'#111','text-halo-color':'#fff','text-halo-width':1.2}});
}
function bindLayerClick(layerId,titleField){
map.on('click',layerId,e=>{
const f=e.features?.[0]; if(!f)return;
const p=f.properties||{}, c=f.geometry.coordinates;
new maplibregl.Popup({maxWidth:'320px'}).setLngLat(c).setHTML('<div class="popup-title">'+escapeHtml(p[titleField]||'')+'</div><div class="popup-coords">'+escapeHtml(p.info||'')+'</div>').addTo(map);
});
map.on('mouseenter',layerId,()=>map.getCanvas().style.cursor='pointer');
map.on('mouseleave',layerId,()=>map.getCanvas().style.cursor='');
}
async function loadFeeders(){
if(feedersLoaded)return;
statusEl.textContent='جاري تحميل مسارات المغذيات من CAD…';
try{
const raw=await fetch('../data/feeders/feeder-routes.geojson').then(r=>{if(!r.ok)throw new Error('route file '+r.status);return r.json();});
const features=(raw.features||[]).map(f=>{
const g=f.geometry;
if(!g||g.type!=='MultiLineString')return null;
return {...f,geometry:{type:'MultiLineString',coordinates:g.coordinates.map(line=>line.map(([x,y])=>cadToLngLat(x,y)))}};
}).filter(Boolean);
map.addSource('feeders-layer',{type:'geojson',data:{type:'FeatureCollection',features}});
if(!map.getLayer('feeder-routes-line'))map.addLayer({id:'feeder-routes-line',type:'line',source:'feeders-layer',paint:{'line-color':['match',['get','confidence'],'high','#e67e22','medium','#f39c12','#d35400'],'line-width':['interpolate',['linear'],['zoom'],8,2,12,3.5,16,6],'line-opacity':.9,'line-blur':.15}});
map.on('click','feeder-routes-line',e=>{
const f=e.features?.[0];if(!f)return;
const p=f.properties||{};
new maplibregl.Popup({maxWidth:'320px'}).setLngLat(e.lngLat).setHTML('<div class="popup-title">المغذي '+escapeHtml(p.name||'')+'</div><div class="popup-coords">المحطة: '+escapeHtml(p.station||'غير محددة')+'<br>درجة المطابقة: '+escapeHtml(p.confidence||'')+'</div>').addTo(map);
});
map.on('mouseenter','feeder-routes-line',()=>map.getCanvas().style.cursor='pointer');
map.on('mouseleave','feeder-routes-line',()=>map.getCanvas().style.cursor='');
feedersLoaded=true;
statusEl.textContent='تم تحميل '+features.length.toLocaleString('ar-SA')+' مسار مغذي من هندسة CAD.';
}catch(e){console.error(e);statusEl.textContent='تعذر تحميل مسارات المغذيات. تأكد من اكتمال بناء بيانات CAD.'}
}
async function loadSubstations(){
if(substationsLoaded)return;
statusEl.textContent='جاري تحميل طبقة المحطات…';
try{
const r=await fetch('../data/feeders/stations.json'); const stations=await r.json();
const fs=stations.map(s=>{const c=cadToLngLat(s.x,s.y);return {type:'Feature',geometry:{type:'Point',coordinates:c},properties:{name:s.name,info:'طبقة CAD: '+s.layer}}});
map.addSource('substations-layer',{type:'geojson',data:{type:'FeatureCollection',features:fs}});
addPointLayer('substations-layer','substation-points','#8e44ad',8);
addLabelLayer('substations-layer','substation-labels','name');
bindLayerClick('substation-points','name');
substationsLoaded=true;
statusEl.textContent='تم تحميل مواقع المحطات المستخرجة من CAD.';
}catch(e){console.error(e);statusEl.textContent='تعذر تحميل بيانات المحطات.'}
}
async function loadMeters(){
if(metersLoaded)return;
statusEl.textContent='جاري تحميل قاعدة بيانات العدادات…';
try{
const files=Array.from({length:15},(_,i)=>'../data/part-'+(i+1)+'.json');
const parts=await Promise.all(files.map(u=>fetch(u).then(r=>r.json())));
const rows=parts.flat();
const fs=rows.map(r=>{
const lat=Number(r.lat),lng=Number(r.lng);
if(!Number.isFinite(lat)||!Number.isFinite(lng))return null;
return {type:'Feature',geometry:{type:'Point',coordinates:[lng,lat]},properties:{name:String(r.d||r.a||'عداد'),info:'الحساب: '+String(r.a??'')+' | الاشتراك: '+String(r.s??'')+' | الرقم التفصيلي: '+String(r.d??'')}};
}).filter(Boolean);
map.addSource('meters-layer',{type:'geojson',data:{type:'FeatureCollection',features:fs},cluster:true,clusterMaxZoom:13,clusterRadius:35});
map.addLayer({id:'meter-clusters',type:'circle',source:'meters-layer',filter:['has','point_count'],paint:{'circle-radius':['step',['get','point_count'],15,20,19,100,24,500,29],'circle-color':['step',['get','point_count'],'#16a085',20,'#2980b9',100,'#d35400',500,'#c0392b'],'circle-stroke-color':'#fff','circle-stroke-width':1.5}});
map.addLayer({id:'meter-counts',type:'symbol',source:'meters-layer',filter:['has','point_count'],layout:{'text-field':['get','point_count_abbreviated'],'text-size':11},paint:{'text-color':'#fff'}});
map.addLayer({id:'meter-points',type:'circle',source:'meters-layer',filter:['!',['has','point_count']],minzoom:13,paint:{'circle-radius':['interpolate',['linear'],['zoom'],13,3,17,5,20,7],'circle-color':'#00a879','circle-stroke-color':'#fff','circle-stroke-width':1}});
map.on('click','meter-clusters',e=>{const f=map.queryRenderedFeatures(e.point,{layers:['meter-clusters']})[0];map.getSource('meters-layer').getClusterExpansionZoom(f.properties.cluster_id,(err,z)=>{if(!err)map.easeTo({center:f.geometry.coordinates,zoom:z});});});
map.on('click','meter-points',e=>{const f=e.features[0];const c=f.geometry.coordinates;new maplibregl.Popup({maxWidth:'330px'}).setLngLat(c).setHTML('<div class="popup-title">عداد '+escapeHtml(f.properties.name)+'</div><div class="popup-coords">'+escapeHtml(f.properties.info)+'</div><div class="map-actions"><a class="map-btn google" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(c[1]+','+c[0])+'">📍 Google Maps</a></div>').addTo(map);});
metersLoaded=true;
statusEl.textContent='تم تحميل بيانات العدادات ذات الإحداثيات.';
}catch(e){console.error(e);statusEl.textContent='تعذر تحميل قاعدة بيانات العدادات.'}
}

function addEquipmentLayers(){
if(!equipment.length)return;
if(!map.getSource('equipment'))map.addSource('equipment',{type:'geojson',data:{type:'FeatureCollection',features:equipment},cluster:true,clusterMaxZoom:11,clusterRadius:45});
if(!map.getLayer('clusters'))map.addLayer({id:'clusters',type:'circle',source:'equipment',filter:['has','point_count'],paint:{'circle-radius':['step',['get','point_count'],18,20,22,100,27,500,32],'circle-color':['step',['get','point_count'],'#2f7d32',20,'#1976d2',100,'#d98b00',500,'#c62828'],'circle-stroke-color':'#fff','circle-stroke-width':1.5}});
if(!map.getLayer('cluster-count'))map.addLayer({id:'cluster-count',type:'symbol',source:'equipment',filter:['has','point_count'],layout:{'text-field':['get','point_count_abbreviated'],'text-size':12,'text-font':['Open Sans Bold']},paint:{'text-color':'#fff'}});
if(!map.getLayer('equipment-points'))map.addLayer({id:'equipment-points',type:'circle',source:'equipment',filter:['!',['has','point_count']],minzoom:12,paint:{'circle-radius':['interpolate',['linear'],['zoom'],12,3,16,5,19,7],'circle-color':'#1976d2','circle-stroke-color':'#fff','circle-stroke-width':1,'circle-opacity':.9}});
if(!map.getLayer('equipment-labels'))map.addLayer({id:'equipment-labels',type:'symbol',source:'equipment',minzoom:12,layout:{'text-field':['get','name'],'text-size':11,'text-offset':[0,1.15],'text-anchor':'top','text-allow-overlap':false,'text-ignore-placement':false},paint:{'text-color':'#111','text-halo-color':'#fff','text-halo-width':1.5}});
if(!map._equipmentEventsBound){
map._equipmentEventsBound=true;
map.on('click','clusters',e=>{const f=map.queryRenderedFeatures(e.point,{layers:['clusters']})[0];map.getSource('equipment').getClusterExpansionZoom(f.properties.cluster_id,(err,zoom)=>{if(!err)map.easeTo({center:f.geometry.coordinates,zoom});});});
map.on('click','equipment-points',e=>{const f=e.features[0];showPopup(f.properties.name,f.geometry.coordinates[1],f.geometry.coordinates[0]);});
['clusters','equipment-points'].forEach(layer=>map.on('mouseenter',layer,()=>map.getCanvas().style.cursor='pointer'));
['clusters','equipment-points'].forEach(layer=>map.on('mouseleave',layer,()=>map.getCanvas().style.cursor=''));
}
}

map.on('load',async()=>{
addCad();
try{
const r=await fetch('data/equipment-lookup.json',{cache:'force-cache'});
const data=await r.json();
const records=data.records||{};
const features=[];
Object.keys(records).forEach(key=>{
(records[key]||[]).forEach(row=>{
const name=row[0],lat=+row[1],lon=+row[2];
if(!Number.isFinite(lat)||!Number.isFinite(lon))return;
features.push({type:'Feature',geometry:{type:'Point',coordinates:[lon,lat]},properties:{name:String(name),key:String(key)}});
});
});
equipment=features;
addEquipmentLayers();
statusEl.textContent='تم تحميل '+features.length.toLocaleString('en-US')+' نقطة — جرب التحريك والتكبير الآن.';
const bounds=features.reduce((b,f)=>b.extend(f.geometry.coordinates),new maplibregl.LngLatBounds());
if(!bounds.isEmpty())map.fitBounds(bounds,{padding:50,maxZoom:14,duration:0});
}catch(e){console.error(e);statusEl.textContent='تعذر تحميل قاعدة بيانات المعدات.'}
});

function showPopup(name,lat,lon){
const mapsUrl='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(lat+','+lon);
new maplibregl.Popup({maxWidth:'300px'}).setLngLat([lon,lat]).setHTML(
'<div class="popup-title">'+escapeHtml(name)+'</div>'+
'<div class="popup-coords">Lat: '+lat.toFixed(6)+'<br>Lon: '+lon.toFixed(6)+'</div>'+
'<div class="map-actions"><a class="map-btn google" href="'+mapsUrl+'" target="_blank" rel="noopener noreferrer">📍 Google Maps</a>'+
'<button class="map-btn copy" onclick="copyCoords('+lat+','+lon+')">📋 نسخ</button></div>'
).addTo(map);
}
function copyCoords(lat,lon){
const v=lat.toFixed(6)+', '+lon.toFixed(6);
navigator.clipboard?.writeText(v).then(()=>statusEl.textContent='تم نسخ الإحداثيات: '+v).catch(()=>statusEl.textContent='الإحداثيات: '+v);
}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}

document.getElementById('find').onclick=findEquipment;
document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter')findEquipment()});
function normalize(v){return String(v||'').toUpperCase().replace(/[\s\-_/.,:;()\[\]{}#\\]+/g,'')}
function findEquipment(){
const q=normalize(document.getElementById('search').value);if(!q)return;
const hit=equipment.find(f=>normalize(f.properties.name)===q||normalize(f.properties.key)===q);
if(!hit){statusEl.textContent='لم يتم العثور على المعدة المطلوبة.';return}
const [lon,lat]=hit.geometry.coordinates;
map.easeTo({center:[lon,lat],zoom:19,duration:600});showPopup(hit.properties.name,lat,lon);
}

function setLayerVisibility(layerIds,visible){
layerIds.forEach(id=>{
if(map.getLayer(id))map.setLayoutProperty(id,'visibility',visible?'visible':'none');
});
}
document.getElementById('toggleEquipment').onchange=e=>{
equipmentVisible=e.target.checked;
setLayerVisibility(['clusters','cluster-count','equipment-points','equipment-labels'],equipmentVisible);
statusEl.textContent=equipmentVisible?'تم إظهار طبقة المعدات.':'تم إخفاء طبقة المعدات.';
};
document.getElementById('toggleCad').onchange=e=>{
cadVisible=e.target.checked;
setLayerVisibility(['cad-layer'],cadVisible);
statusEl.textContent=cadVisible?'تم إظهار رسم CAD.':'تم إخفاء رسم CAD.';
};
document.getElementById('toggleFeeders').onchange=async e=>{
if(e.target.checked){await loadFeeders();setLayerVisibility(['feeder-routes-line'],true);}else setLayerVisibility(['feeder-routes-line'],false);
};
document.getElementById('toggleMeters').onchange=async e=>{
if(e.target.checked){await loadMeters();setLayerVisibility(['meter-clusters','meter-counts','meter-points'],true);}else setLayerVisibility(['meter-clusters','meter-counts','meter-points'],false);
};
document.getElementById('toggleSubstations').onchange=async e=>{
if(e.target.checked){await loadSubstations();setLayerVisibility(['substation-points','substation-labels'],true);}else setLayerVisibility(['substation-points','substation-labels'],false);
};
document.getElementById('toggleLines').onchange=e=>{
linesVisible=e.target.checked;
statusEl.textContent=linesVisible?'طبقة الكابلات والخطوط ممثلة ضمن رسم CAD الحالي.':'تم إخفاء طبقة الكابلات والخطوط.';
setLayerVisibility(['cad-layer'],linesVisible||cadVisible);
};
document.getElementById('toggleCabinets').onchange=e=>{
cabinetsVisible=e.target.checked;
statusEl.textContent=cabinetsVisible?'بيانات الكبائن واللوحات ستظهر عند توفير طبقة إحداثيات مستقلة لها.':'تم إيقاف طبقة الكبائن واللوحات.';
};

document.getElementById('fit').onclick=()=>{
if(!equipment.length)return;
const b=equipment.reduce((x,f)=>x.extend(f.geometry.coordinates),new maplibregl.LngLatBounds());
map.fitBounds(b,{padding:50,maxZoom:14});
};

function addCad(){
if(map.getSource('cad'))return;
map.addSource('cad',{type:'image',url:'https://raw.githubusercontent.com/ops11141/sec/main/data/feeders/full-drawing.svg',coordinates:[[45.935,28.465],[45.995,28.465],[45.995,28.365],[45.935,28.365]]});
map.addLayer({id:'cad-layer',type:'raster',source:'cad',paint:{'raster-opacity':0.55}});
}
</script>
</body>
</html>
