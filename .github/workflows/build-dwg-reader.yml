name: Build self-hosted DWG reader

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-dwg-reader.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download CADViewer runtime
        run: |
          rm -rf cad-viewer cad-data/open
          git clone --depth 1 https://github.com/Orua/CADViewer.git /tmp/CADViewer
          cp -a /tmp/CADViewer/cad-viewer ./cad-viewer
          mkdir -p cad-data
          cp -a /tmp/CADViewer/cad-data/open ./cad-data/open

      - name: Add feeder search API
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('cad-viewer/viewer.js')
          s = p.read_text(encoding='utf-8-sig')
          # Correct INSERT placement: libredwg exposes INSERT insertion points in OCS.
          old_ref = """function referenceMatrices(entity, block) {
  const matrices = [];
  const rows = Math.max(1, Math.min(entity.rowCount || 1, 100));
  const columns = Math.max(1, Math.min(entity.columnCount || 1, 100));
  for (let row = 0; row < rows; row += 1) {
    for (let column = 0; column < columns; column += 1) {
      matrices.push(new DOMMatrix()
        .translate(entity.insertionPoint.x + column * (entity.columnSpacing || 0), entity.insertionPoint.y + row * (entity.rowSpacing || 0))
        .rotate((entity.rotation || 0) * 180 / Math.PI)
        .scale(entity.xScale || 1, entity.yScale || 1));
    }
  }
  return matrices;
}"""
          new_ref = """function ocsBasis(extrusionDirection) {
  const nx = Number(extrusionDirection?.x);
  const ny = Number(extrusionDirection?.y);
  const nz = Number(extrusionDirection?.z);
  const length = Math.hypot(nx, ny, nz);
  const normal = length > 1e-12 ? { x: nx / length, y: ny / length, z: nz / length } : { x: 0, y: 0, z: 1 };
  let ax;
  if (Math.abs(normal.x) < 1 / 64 && Math.abs(normal.y) < 1 / 64) {
    ax = { x: 0, y: 1, z: 0 };
  } else {
    const xy = Math.hypot(normal.x, normal.y);
    ax = { x: -normal.y / xy, y: normal.x / xy, z: 0 };
  }
  const ay = {
    x: normal.y * ax.z - normal.z * ax.y,
    y: normal.z * ax.x - normal.x * ax.z,
    z: normal.x * ax.y - normal.y * ax.x,
  };
  return { normal, ax, ay };
}

function ocsToWcsPoint(point, extrusionDirection) {
  const { normal, ax, ay } = ocsBasis(extrusionDirection);
  const x = Number(point?.x) || 0;
  const y = Number(point?.y) || 0;
  const z = Number(point?.z) || 0;
  return {
    x: x * ax.x + y * ay.x + z * normal.x,
    y: x * ax.y + y * ay.y + z * normal.y,
    z: x * ax.z + y * ay.z + z * normal.z,
  };
}

function ocsToWcsVector(x, y, z, extrusionDirection) {
  return ocsToWcsPoint({ x, y, z }, extrusionDirection);
}

function referenceMatrices(entity, block) {
  const baseX = Number(block?.basePoint?.x) || 0;
  const baseY = Number(block?.basePoint?.y) || 0;
  const insertion = ocsToWcsPoint(entity.insertionPoint, entity.extrusionDirection);
  const columnStep = ocsToWcsVector(Number(entity.columnSpacing) || 0, 0, 0, entity.extrusionDirection);
  const rowStep = ocsToWcsVector(0, Number(entity.rowSpacing) || 0, 0, entity.extrusionDirection);
  const matrices = [];
  const rows = Math.max(1, Math.min(entity.rowCount || 1, 100));
  const columns = Math.max(1, Math.min(entity.columnCount || 1, 100));
  for (let row = 0; row < rows; row += 1) {
    for (let column = 0; column < columns; column += 1) {
      matrices.push(new DOMMatrix()
        .translate(
          insertion.x + column * columnStep.x + row * rowStep.x,
          insertion.y + column * columnStep.y + row * rowStep.y,
        )
        .rotate((entity.rotation || 0) * 180 / Math.PI)
        .scale(entity.xScale || 1, entity.yScale || 1)
        .translate(-baseX, -baseY));
    }
  }
  return matrices;
}"""
          if old_ref not in s:
              raise SystemExit('referenceMatrices marker not found in generated viewer')
          s = s.replace(old_ref, new_ref)

          marker = "applyLanguage();\nresetViewer();\nresize();"
          patch = r'''
          window.cadViewerSearch = function(query, occurrence = 0) {
            const q = String(query || '').trim().toLowerCase();
            if (!q) return { found: false, count: 0 };
            const pool = [];
            const add = (item) => {
              if (item && item.text) pool.push(item);
            };
            for (const item of textItems) add(item);
            for (const block of blocks.values()) {
              for (const item of (block.directTexts || [])) add(item);
            }
            const matches = pool.filter(item => String(item.text).toLowerCase().includes(q));
            if (!matches.length) return { found: false, count: 0 };
            const index = Math.max(0, Math.min(Number(occurrence) || 0, matches.length - 1));
            const item = matches[index];
            const width = Math.max(item.extentWidth || item.height * Math.max(String(item.text).length, 4), item.height * 8);
            const height = Math.max(item.extentHeight || item.height * 4, item.height * 4);
            const targetScale = Math.min(canvas.clientWidth / width, canvas.clientHeight / height) * 0.35;
            camera.scale = Math.max(1e-8, Math.min(1e8, targetScale));
            camera.x = canvas.clientWidth / 2 - item.x * camera.scale;
            camera.y = canvas.clientHeight / 2 + item.y * camera.scale;
            scheduleRender();
            return { found: true, count: matches.length, index, text: item.text, x: item.x, y: item.y };
          };
          window.cadViewerGetTextCount = function() {
            return textItems.length;
          };

          const initialFile = new URLSearchParams(window.location.search).get('file');
          if (initialFile) {
            setTimeout(() => openUrl(initialFile), 0);
          }

          applyLanguage();
          resetViewer();
          resize();
          '''
          if marker not in s:
              raise SystemExit('viewer marker not found')
          s = s.replace(marker, patch.strip())
          p.write_text(s, encoding='utf-8')
          PY

      - name: Add Arabic search overlay
        run: |
          cat > cad-viewer/cad-search.js <<'EOF'
          (() => {
            const style = document.createElement('style');
            style.textContent = `
              #feederCadSearch{position:absolute;z-index:80;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;width:min(680px,calc(100% - 20px));padding:7px;background:rgba(17,24,39,.94);border:1px solid #475569;border-radius:10px;box-shadow:0 5px 18px rgba(0,0,0,.35)}
              #feederCadSearch input{flex:1;min-width:0;padding:9px 11px;border-radius:7px;border:1px solid #64748b;background:#fff;color:#111827;font-size:14px;direction:ltr}
              #feederCadSearch button{border:0;border-radius:7px;padding:9px 12px;background:#087f5b;color:#fff;font-weight:700;cursor:pointer;white-space:nowrap}
              #feederCadSearch button.nav{background:#334155}
              #feederCadSearch button:disabled{opacity:.45;cursor:not-allowed}
              #feederCadSearch span{color:#e5e7eb;font-size:12px;white-space:nowrap}
              @media(max-width:600px){#feederCadSearch{top:5px;gap:4px;padding:5px}#feederCadSearch span{display:none}#feederCadSearch input{font-size:13px;padding:8px}#feederCadSearch button{padding:8px 9px;font-size:12px}}
            `;
            document.head.appendChild(style);
            const box=document.createElement('div');
            box.id='feederCadSearch';
            box.innerHTML='<input id="feederCadSearchInput" placeholder="🔎 ابحث داخل الرسم مثل F-8.13" autocomplete="off"><button id="feederCadSearchBtn">بحث</button><button id="feederCadSearchPrev" class="nav" type="button" disabled>السابق</button><button id="feederCadSearchNext" class="nav" type="button" disabled>التالي</button><span id="feederCadSearchStatus">جاهز</span>';
            const host=document.querySelector('.viewer-canvas-area')||document.body;
            host.appendChild(box);
            let occurrence=0,resultCount=0,lastQuery='';
            const input=document.getElementById('feederCadSearchInput');
            const searchBtn=document.getElementById('feederCadSearchBtn');
            const prevBtn=document.getElementById('feederCadSearchPrev');
            const nextBtn=document.getElementById('feederCadSearchNext');
            const status=document.getElementById('feederCadSearchStatus');
            function updateButtons(){const enabled=resultCount>1;prevBtn.disabled=!enabled;nextBtn.disabled=!enabled;}
            function runSearch(reset=true){
              const query=input.value.trim();
              if(reset||query!==lastQuery) occurrence=0;
              lastQuery=query;
              const result=window.cadViewerSearch?.(query,occurrence);
              if(!result?.found){resultCount=0;status.textContent=query?'لم يتم العثور':'جاهز';updateButtons();return;}
              resultCount=result.count;occurrence=result.index;status.textContent=(result.index+1)+'/'+result.count+'  '+result.text;updateButtons();
            }
            function moveResult(step){if(!lastQuery||resultCount<2)return;occurrence=(occurrence+step+resultCount)%resultCount;runSearch(false);}
            searchBtn.onclick=()=>runSearch(true);
            prevBtn.onclick=()=>moveResult(-1);
            nextBtn.onclick=()=>moveResult(1);
            input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();runSearch(true)}else if(e.key==='ArrowDown'){e.preventDefault();moveResult(1)}else if(e.key==='ArrowUp'){e.preventDefault();moveResult(-1)}});
            input.addEventListener('input',()=>{occurrence=0;resultCount=0;lastQuery='';status.textContent='جاهز';updateButtons();});
          })();
          EOF
          python3 <<'PY'
          from pathlib import Path
          p=Path('cad-viewer/index.html')
          s=p.read_text(encoding='utf-8-sig')
          marker='<script type="module" src="./viewer.js?v=20260910-fast-only-1"></script>'
          if marker not in s:
              marker='<script type="module" src="./viewer.js"></script>'
          s=s.replace(marker, marker+'\n    <script src="./cad-search.js"></script>')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit reader
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cad-viewer cad-data/open
          git diff --cached --quiet && exit 0
          git commit -m "Add self-hosted DWG reader"
          git pull --rebase origin main
          git push
