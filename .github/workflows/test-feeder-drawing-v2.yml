name: Test feeder drawing v2

on:
  workflow_dispatch:
  push:
    paths:
      - "cad/FINAL DISPATCH - UPDATE.dwg"
      - "tools/test-feeder-drawing-v2.py"
      - ".github/workflows/test-feeder-drawing-v2.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LibreDWG
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config \
            libpcre2-dev libxml2-dev texinfo wget
          cd /tmp
          wget -q https://github.com/LibreDWG/libredwg/releases/download/0.14/libredwg-0.14.tar.xz
          tar -xf libredwg-0.14.tar.xz
          cd libredwg-0.14
          ./configure --disable-shared --disable-bindings --disable-docs
          make -j2
          sudo make install
          sudo ldconfig
          dwg2dxf --version

      - name: Install Python
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ezdxf matplotlib

      - name: Convert DWG to DXF
        run: |
          dwg2dxf -o /tmp/final-dispatch.dxf "cad/FINAL DISPATCH - UPDATE.dwg"

      - name: Render F-8.13 as one full drawing
        run: |
          python3 tools/test-feeder-drawing-v2.py

      - name: Commit test drawing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feeders/drawings
          if git diff --cached --quiet; then
            echo "No drawing changes."
          else
            git commit -m "Publish complete feeder drawing"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                echo "Drawing pushed successfully."
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep 3
            done
            exit 1
          fi
