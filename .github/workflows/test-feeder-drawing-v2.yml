name: Test feeder drawing v2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LibreDWG
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config \
            libpcre2-dev libxml2-dev texinfo wget
          cd /tmp
          wget -q https://ftp.gnu.org/pub/gnu/libredwg/libredwg-0.14.tar.xz
          tar -xf libredwg-0.14.tar.xz
          cd libredwg-0.14
          ./configure --disable-shared --disable-bindings --disable-docs
          make -j2
          sudo make install
          sudo ldconfig
          dwg2dxf --version

      - name: Install Python
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ezdxf matplotlib

      - name: Convert DWG to DXF
        run: |
          dwg2dxf -o /tmp/final-dispatch.dxf "cad/FINAL DISPATCH - UPDATE.dwg"

      - name: Render F-8.13 as one full drawing
        run: |
          python3 tools/test-feeder-drawing-v2.py

      - name: Package drawing review files
        run: |
          mkdir -p /tmp/feeder-review
          cp -a data/feeders/test-drawings-v2/. /tmp/feeder-review/
          du -ah /tmp/feeder-review | sort -h | tail -20

      - name: Upload drawing as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: F-8.13-drawing-review
          path: /tmp/feeder-review/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
