name: Build feeder database

on:
  workflow_dispatch:
  push:
    paths:
      - "cad/FINAL DISPATCH - UPDATE.dwg"
      - "tools/build-feeders.mjs"
      - "package.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build feeder database
        run: npm run build:feeders

      - name: Commit generated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feeders
          if git diff --cached --quiet; then
            echo "No generated feeder database changes."
          else
            git commit -m "Build feeder database from DWG"
            git push
          fi
