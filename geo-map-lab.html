<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GEO.dwg على الخريطة | تجربة مستقرة</title>
<link href="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
html,body,#map{height:100%;margin:0}body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#111}#map{direction:ltr}
.panel{position:absolute;z-index:20;top:12px;right:12px;width:min(390px,calc(100vw - 24px));background:rgba(18,18,18,.94);color:#fff;border-radius:14px;padding:13px;box-shadow:0 8px 30px #0008}
.panel h2{font-size:18px;margin:0 0 7px}.panel p{font-size:12px;color:#bbb;margin:5px 0 10px;line-height:1.55}button{border:0;border-radius:9px;padding:9px 11px;background:#2f7d32;color:#fff;font-weight:700;margin:2px;cursor:pointer}.actions{display:flex;flex-wrap:wrap;gap:4px}.map-type{display:flex;gap:6px;margin-bottom:8px}.map-type button{flex:1;background:#3b3b3b}.map-type button.active{background:#1976d2}.row{display:flex;align-items:center;gap:8px;margin-top:8px}.row label{font-size:12px;white-space:nowrap}.row input{flex:1}.badge{font-size:11px;color:#9fe6a0;margin-top:8px;line-height:1.45}
</style></head><body>
<div id="map"></div><div class="panel"><h2>🗺️ GEO.dwg + خريطة مشاريعنا</h2><p>عرض سريع ومستقر للرسم الهندسي فوق الخريطة الواقعية، بدون معالجة DWG الضخم داخل الهاتف.</p>
<div class="map-type"><button id="street" class="active">🗺️ الشوارع</button><button id="sat">🛰️ الواقعية</button></div>
<div class="actions"><button id="fit">ملاءمة الرسم</button><button id="toggle">إظهار/إخفاء الرسم</button></div>
<div class="row"><label>شفافية الرسم</label><input id="opacity" type="range" min="0" max="100" value="55"></div><div class="badge" id="status">جاري تجهيز الخريطة…</div></div>
<script src="https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.js"></script><script>
const status=document.getElementById('status'),bounds=[[45.935,28.365],[45.995,28.465]];
const streetStyle={version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap contributors'}},layers:[{id:'osm',type:'raster',source:'osm'}]};
const satStyle={version:8,sources:{sat:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',],tileSize:256,attribution:'Tiles © Esri'}},layers:[{id:'sat',type:'raster',source:'sat'}]};
const map=new maplibregl.Map({container:'map',style:streetStyle,center:[45.97,28.43],zoom:12,maxZoom:20,attributionControl:true});map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-left');
const street=document.getElementById('street'),sat=document.getElementById('sat');
function addCad(){if(map.getSource('geo-cad'))return;map.addSource('geo-cad',{type:'image',url:'data/feeders/full-drawing.svg',coordinates:[[45.935,28.465],[45.995,28.465],[45.995,28.365],[45.935,28.365]]});map.addLayer({id:'geo-cad-layer',type:'raster',source:'geo-cad',paint:{'raster-opacity':Number(document.getElementById('opacity').value)/100}});status.textContent='✅ تم عرض الرسم الهندسي على الخريطة.'}
function setStyle(s){const c=map.getCenter(),z=map.getZoom();map.setStyle(s);map.once('styledata',()=>{addCad();map.setCenter(c);map.setZoom(z)})}
street.onclick=()=>{street.classList.add('active');sat.classList.remove('active');setStyle(streetStyle)};sat.onclick=()=>{sat.classList.add('active');street.classList.remove('active');setStyle(satStyle)};
map.on('load',()=>{addCad();map.fitBounds(bounds,{padding:20,duration:0})});
document.getElementById('opacity').oninput=e=>{if(map.getLayer('geo-cad-layer'))map.setPaintProperty('geo-cad-layer','raster-opacity',Number(e.target.value)/100)};
document.getElementById('fit').onclick=()=>map.fitBounds(bounds,{padding:20,duration:0});
document.getElementById('toggle').onclick=()=>{const l=map.getLayoutProperty('geo-cad-layer','visibility');map.setLayoutProperty('geo-cad-layer','visibility',l==='none'?'visible':'none');status.textContent=l==='none'?'تم إظهار الرسم.':'تم إخفاء الرسم.'};
</script></body></html>
