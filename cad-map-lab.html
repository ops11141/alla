<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مختبر خريطة CAD | قسم الصيانة</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0}body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#111}
#map{direction:ltr}.panel{position:absolute;z-index:1000;top:12px;right:12px;width:min(390px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:rgba(15,23,42,.96);color:#fff;border-radius:15px;padding:14px;box-shadow:0 10px 35px #0009}
h2{font-size:17px;margin:0 0 4px}.note{font-size:11px;color:#fbbf24;line-height:1.5;margin:0 0 12px}
input,select{width:100%;box-sizing:border-box;border:1px solid #475569;background:#1e293b;color:#fff;border-radius:9px;padding:10px;margin:4px 0 7px}
button{border:0;border-radius:9px;padding:9px 11px;background:#15803d;color:#fff;font-weight:800;margin:2px;cursor:pointer}.alt{background:#334155}.row{display:flex;gap:6px;align-items:center}.row button{flex:1}.slider{display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:center;margin:8px 0;font-size:11px}
input[type=range]{margin:0}.stat{font-size:11px;color:#cbd5e1;line-height:1.7;border-top:1px solid #334155;margin-top:10px;padding-top:9px}
.legend{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.legend span{font-size:10px;border-radius:6px;padding:3px 6px;background:#1e293b}
.feeder-label{background:#fff;color:#111;border:2px solid var(--c);border-radius:6px;padding:2px 6px;font-weight:900;font-size:11px;box-shadow:0 2px 6px #0008}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
<h2>🧪 مختبر خريطة CAD + GIS</h2>
<p class="note">هذه صفحة تجريبية مستقلة. التحويل بين إحداثيات CAD وGPS هنا تجريبي فقط، ولن يؤثر على cad-map.html.</p>
<select id="feederSelect"><option value="">اختر مغذيًا للتجربة…</option></select>
<input id="feederSearch" placeholder="ابحث عن مغذي مثل F-8.13">
<div class="row"><button id="showFeeder">عرض المغذي</button><button id="clear" class="alt">مسح</button></div>
<div class="slider"><span>CAD</span><input id="cadOpacity" type="range" min="0" max="100" value="48"><b id="cadVal">48%</b></div>
<div class="slider"><span>المعدات</span><input id="eqOpacity" type="range" min="0" max="100" value="90"><b id="eqVal">90%</b></div>
<div class="row"><button id="street" class="alt">🗺️ شوارع</button><button id="sat">🛰️ قمر صناعي</button></div>
<div class="stat" id="status">جاري تحميل بيانات المختبر…</div>
<div class="legend" id="legend"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([28.43,45.97],12);
const street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap'}).addTo(map);
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri'});
const cadBounds=[[28.365,45.935],[28.465,45.995]];
const cad=L.imageOverlay('data/feeders/full-drawing.svg',cadBounds,{opacity:.48,interactive:false}).addTo(map);
const equipmentLayer=L.layerGroup().addTo(map), feederLayer=L.layerGroup().addTo(map);
let equipment=[], feeders=[], selected=null;

const colors=['#00e676','#00b0ff','#ff1744','#ffea00','#d500f9','#ff6d00','#76ff03','#00e5ff','#ff4081','#7c4dff'];
function colorFor(name){let h=0;for(const c of String(name))h=(h*31+c.charCodeAt(0))>>>0;return colors[h%colors.length]}
function norm(v){return String(v||'').toUpperCase().replace(/[\s\-_/.,:;()\[\]{}#\\]+/g,'')}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}

function setStatus(s){document.getElementById('status').textContent=s}
function refreshLegend(){document.getElementById('legend').innerHTML=feeders.slice(0,18).map(f=>'<span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+colorFor(f.name)+'"></i> '+esc(f.name)+'</span>').join('')}

Promise.all([fetch('data/equipment-lookup.json').then(r=>r.json()),fetch('data/feeders/feeders.json').then(r=>r.json())])
.then(([eqData,feedData])=>{
  const records=eqData.records||{};
  Object.keys(records).forEach(k=>(records[k]||[]).forEach(row=>{
    const lat=+row[1],lon=+row[2],name=row[0];
    if(!Number.isFinite(lat)||!Number.isFinite(lon))return;
    const m=L.circleMarker([lat,lon],{radius:3,weight:1,fillOpacity:.9});
    m.bindPopup('<b>'+esc(name)+'</b><br><small>'+lat.toFixed(6)+', '+lon.toFixed(6)+'</small>');
    m.options.eqName=name;m.addTo(equipmentLayer);equipment.push(m);
  }));
  feeders=Array.isArray(feedData)?feedData:[];
  const sel=document.getElementById('feederSelect');
  [...feeders].sort((a,b)=>String(a.name).localeCompare(String(b.name))).forEach(f=>{
    const o=document.createElement('option');o.value=f.name;o.textContent=f.name+' — '+(f.station||'');sel.appendChild(o);
  });
  refreshLegend();
  setStatus('المعدات: '+equipment.length.toLocaleString('en-US')+' نقطة — المغذيات: '+feeders.length.toLocaleString('en-US')+' مغذي. اختر مغذيًا للبدء.');
})
.catch(e=>setStatus('تعذر تحميل بيانات التجربة: '+e.message));

function cadToMap(x,y){
  // Experimental normalization only. Final calibration will use real control points.
  const minX=70000,maxX=135000,minY=-20000,maxY=25000;
  const lon=45.935+(x-minX)/(maxX-minX)*(45.995-45.935);
  const lat=28.365+(y-minY)/(maxY-minY)*(28.465-28.365);
  return [lat,lon];
}
function clearFeeder(){feederLayer.clearLayers();selected=null}
function showFeeder(){
  const q=document.getElementById('feederSearch').value||document.getElementById('feederSelect').value;
  const f=feeders.find(x=>norm(x.name)===norm(q));
  if(!f){setStatus('لم يتم العثور على المغذي.');return}
  clearFeeder();selected=f;const c=colorFor(f.name);
  const pts=[];
  (f.positions||[]).forEach(p=>{
    if(!Number.isFinite(+p.x)||!Number.isFinite(+p.y))return;
    const ll=cadToMap(+p.x,+p.y);pts.push(ll);
    L.circleMarker(ll,{radius:7,color:c,weight:3,fillColor:c,fillOpacity:.75})
      .bindPopup('<b>'+esc(f.name)+'</b><br>CAD X: '+(+p.x).toFixed(2)+'<br>CAD Y: '+(+p.y).toFixed(2)+'<br>الطبقة: '+esc(p.layer||''))
      .addTo(feederLayer);
    L.marker(ll,{interactive:false,icon:L.divIcon({className:'',html:'<span class="feeder-label" style="--c:'+c+'">'+esc(f.name)+'</span>',iconSize:null,iconAnchor:[-8,8]})}).addTo(feederLayer);
  });
  if(pts.length){map.fitBounds(L.latLngBounds(pts).pad(.25));}
  document.getElementById('feederSelect').value=f.name;
  document.getElementById('feederSearch').value=f.name;
  setStatus(f.name+' — '+pts.length+' موضع CAD. اللون الحالي تجريبي: '+c+'، والتحويل المكاني تجريبي.');
}
document.getElementById('showFeeder').onclick=showFeeder;
document.getElementById('feederSearch').onkeydown=e=>{if(e.key==='Enter')showFeeder()};
document.getElementById('feederSelect').onchange=e=>{document.getElementById('feederSearch').value=e.target.value};
document.getElementById('clear').onclick=()=>{clearFeeder();setStatus('تم مسح طبقة المغذي التجريبية.')};
document.getElementById('cadOpacity').oninput=e=>{cad.setOpacity(+e.target.value/100);document.getElementById('cadVal').textContent=e.target.value+'%'};
document.getElementById('eqOpacity').oninput=e=>{equipmentLayer.eachLayer(m=>m.setStyle({opacity:+e.target.value/100,fillOpacity:+e.target.value/100*.9}));document.getElementById('eqVal').textContent=e.target.value+'%'};
document.getElementById('street').onclick=()=>{if(map.hasLayer(sat))map.removeLayer(sat);street.addTo(map)};
document.getElementById('sat').onclick=()=>{if(map.hasLayer(street))map.removeLayer(street);sat.addTo(map)};
</script>
</body>
</html>
